[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vulndb"
version = "1.0.0"
description = "Поиск уязвимостей продуктов по фидам KLA на SQLite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
vulndb = "vulndb.cli:main"

[tool.setuptools]
packages = ["vulndb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
